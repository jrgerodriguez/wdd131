<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Lazy Load Images – Jorge Menjivar</title>
    <meta name="description" content="Lazy loading images demo, WDD 131 – Dynamic Web Fundamentals." />
    <meta name="author" content="Jorge Menjivar Rodriguez" />
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>

  <body>
    <main>
        <h1>Lazy Load Images</h1>

        <img src="https://picsum.photos/id/1015/400/600" alt="River winding through a green valley" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/1018/400/600" alt="Mountain range under a cloudy sky" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/1025/400/600" alt="A dog sitting in the grass" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/1039/400/600" alt="Snowy mountain peak at sunset" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/1043/400/600" alt="Desert landscape with clear sky" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/id/1050/400/600" alt="Old stone staircase between buildings" width="400" height="600" loading="lazy">
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Jorge Menjivar San Salvador, El Salvador</p>
