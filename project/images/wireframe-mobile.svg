<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960">
  <style>
    .box { fill: #ffffff; stroke: #555555; stroke-width: 2; }
    .bar { fill: #d9d9d9; stroke: #555555; stroke-width: 2; }
    .img { fill: #eeeeee; stroke: #888888; stroke-width: 1.5; }
    .x { stroke: #aaaaaa; stroke-width: 1.5; }
    .line { fill: #bbbbbb; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #333333; }
    .label { font-size: 14px; font-weight: bold; }
    .small { font-size: 12px; }
  </style>

  <!-- Page -->
  <rect class="box" x="1" y="1" width="358" height="958"/>

  <!-- Header: logo, site name, hamburger -->
  <rect class="bar" x="1" y="1" width="358" height="70"/>
  <circle class="img" cx="35" cy="36" r="18"/>
  <text class="small" x="27" y="40">Logo</text>
  <text class="label" x="62" y="41">Explore El Salvador</text>
  <rect fill="#555555" x="300" y="24" width="34" height="4"/>
  <rect fill="#555555" x="300" y="34" width="34" height="4"/>
  <rect fill="#555555" x="300" y="44" width="34" height="4"/>

  <!-- Hero image with heading and button -->
  <rect class="img" x="16" y="86" width="328" height="190"/>
  <line class="x" x1="16" y1="86" x2="344" y2="276"/>
  <line class="x" x1="344" y1="86" x2="16" y2="276"/>
  <rect class="box" x="60" y="140" width="240" height="34"/>
  <text class="label" x="118" y="162">Hero Heading</text>
  <rect class="bar" x="110" y="200" width="140" height="34" rx="6"/>
  <text class="small" x="143" y="221">Explore Button</text>

  <!-- Categories: 2 x 2 grid -->
  <text class="label" x="16" y="310">Categories</text>
  <rect class="box" x="16" y="322" width="158" height="120"/>
  <rect class="img" x="24" y="330" width="142" height="80"/>
  <text class="small" x="24" y="430">Beaches</text>
  <rect class="box" x="186" y="322" width="158" height="120"/>
  <rect class="img" x="194" y="330" width="142" height="80"/>
  <text class="small" x="194" y="430">Mountains</text>
  <rect class="box" x="16" y="454" width="158" height="120"/>
  <rect class="img" x="24" y="462" width="142" height="80"/>
  <text class="small" x="24" y="562">Lakes</text>
  <rect class="box" x="186" y="454" width="158" height="120"/>
  <rect class="img" x="194" y="462" width="142" height="80"/>
  <text class="small" x="194" y="562">Cultural Places</text>

  <!-- Featured destination -->
  <text class="label" x="16" y="610">Featured Destination</text>
  <rect class="img" x="16" y="622" width="328" height="150"/>
  <line class="x" x1="16" y1="622" x2="344" y2="772"/>
  <line class="x" x1="344" y1="622" x2="16" y2="772"/>
  <rect class="line" x="16" y="786" width="328" height="8"/>
  <rect class="line" x="16" y="802" width="300" height="8"/>
  <rect class="line" x="16" y="818" width="220" height="8"/>

  <!-- Call to action -->
  <rect class="bar" x="70" y="842" width="220" height="36" rx="6"/>
  <text class="small" x="120" y="864">Find a Destination</text>

  <!-- Footer -->
  <rect class="bar" x="1" y="894" width="358" height="65"/>
  <text class="small" x="16" y="920">© Name, El Salvador</text>
  <text class="small" x="16" y="942">References · Last Modified</text>
</svg>
