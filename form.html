<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review – Jorge Menjivar</title>
    <meta name="description" content="Product Review form by Jorge Menjivar for WDD 131. Choose a product, rate it from 1 to 5 stars, and share your written review.">
    <meta name="author" content="Jorge Menjivar">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating *</legend>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">&star;</label>
                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">&star;&star;</label>
                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">&star;&star;&star;</label>
                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">&star;&star;&star;&star;</label>
                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">&star;&star;&star;&star;&star;</label>
            </fieldset>

            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability">Durability</label>
                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label>
                <input type="checkbox" id="easy-to-use" name="features" value="easy-to-use">
                <label for="easy-to-use">Easy to Use</label>
                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>
            </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5"></textarea>

            <label for="userName">User Name</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p><span id="currentyear"></span> Jorge Menjivar San Salvador, El Salvador</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
